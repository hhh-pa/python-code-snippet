name: python-snippets

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Test data (recipes superproject resource/shared) ships as an encrypted
# bundle, tests/resources.tar.xz.asc (tar.xz, AES-256, ASCII-armored).
# The passphrase lives in the RESOURCES_PASSPHRASE repository secret.
# To rotate: run tools/build_bundle.sh with a fresh passphrase and set
# the secret to the same value (see the script header).

jobs:
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Run Python snippet tests
        run: python3 tests/run_tests.py --resources tests/resources --jobs 4 --timeout 300 --shard ${{ matrix.shard }}/4

  # Aggregator: branch policy requires a check literally named "test",
  # which the sharded matrix above no longer produces on its own.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards green
        run: |
          if [ "${{ needs.test-shard.result }}" = "success" ]; then exit 0; else exit 1; fi

  perf-callgrind:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: perf-callgrind (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decrypt and extract resources
        env:
          RESOURCES_PASSPHRASE: ${{ secrets.RESOURCES_PASSPHRASE }}
        run: |
          if [ -z "$RESOURCES_PASSPHRASE" ]; then
            echo "error: RESOURCES_PASSPHRASE secret is not configured" >&2
            exit 1
          fi
          mkdir -p tests/resources
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$RESOURCES_PASSPHRASE" \
            -d tests/resources.tar.xz.asc | tar -xJ -C tests/resources --strip-components=1

      - name: Install Valgrind
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          # time: GNU time wraps every native run (cpu/maxrss); the
          # memory signal is unreconcilable without it (issue #40).
          packages: time valgrind
          version: 1.1

      - name: Measure performance (Callgrind instructions)
        # Lean recipe mirroring the clojure twin: one GNU-timed
        # native run (stdout gate + wall/cpu/maxrss) plus one
        # Callgrind run (Ir) per case.
        run: |
          python3 tools/measure.py --resources tests/resources \
            --repeat 1 --callgrind-repeat 1 --jobs 2 --timeout 300 \
            --shard ${{ matrix.shard }}/4 \
            --output perf-results.json --bmf-output bencher-bmf.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Warn when Bencher history is disabled
        if: env.BENCHER_API_KEY == ''
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          echo "::warning::BENCHER_API_KEY secret is not set: Bencher history stays empty (maintainer action: create the python-code-snippet project on Bencher and set the secret)"

      - name: Install Bencher CLI
        if: env.BENCHER_API_KEY != ''
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        uses: bencherdev/bencher@main

      # Threshold policy (issue #40): callgrind_instructions
      # (percentage) only, same shape as the clojure twin's sweep
      # (min/max sample 10/64, 1% upper boundary over the ~zero
      # deterministic-Ir wobble). The cpu_time/peak_memory entries
      # are stripped before reporting: the sweep is repeat-1
      # timing, not a timing signal; the full BMF stays in the
      # uploaded artifacts for RSS reconciliation.
      - name: Strip BMF to tracked measures
        run: |
          jq 'with_entries(select(.value.callgrind_instructions != null) | .value |= {callgrind_instructions})' \
            bencher-bmf.json > bencher-bench.json
          echo "tracked benchmarks: $(jq 'length' bencher-bench.json)"

      - name: Track benchmarks with Bencher
        if: env.BENCHER_API_KEY != ''
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [ "$(jq 'length' bencher-bench.json)" = "0" ]; then
            echo "no callgrind data in shard; skipping Bencher report"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bencher run \
              --project python-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.head_ref }}" \
              --hash "${{ github.event.pull_request.head.sha }}" \
              --start-point "${{ github.base_ref }}" \
              --start-point-hash "${{ github.event.pull_request.base.sha }}" \
              --start-point-clone-thresholds \
              --testbed ubuntu-latest-python \
              --adapter json \
              --file bencher-bench.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          else
            bencher run \
              --project python-code-snippet \
              --key '${{ secrets.BENCHER_API_KEY }}' \
              --branch "${{ github.ref_name }}" \
              --testbed ubuntu-latest-python \
              --threshold-measure callgrind_instructions \
              --threshold-test percentage \
              --threshold-min-sample-size 10 \
              --threshold-max-sample-size 64 \
              --threshold-upper-boundary 0.01 \
              --adapter json \
              --file bencher-bench.json \
              --github-actions "${{ secrets.GITHUB_TOKEN }}"
          fi

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-shard-${{ matrix.shard }}
          path: |
            perf-results.json
            bencher-bmf.json
            bencher-bench.json

  report:
    needs: perf-callgrind
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/profile-runner
        with:
          cache-key: runner-profile-${{ runner.os }}-${{ hashFiles('.github/actions/profile-runner/**', 'scripts/ci/go/go.mod', 'scripts/ci/go/cmd/runner-profile/**', 'scripts/ci/go/internal/executil/**') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: perf-results-shard-*

      - name: Merge shard reports
        run: |
          python3 tools/measure.py --merge perf-results-*/perf-results.json \
            --output perf-results-merged.json \
            --bmf-output bencher-bmf-merged.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Verify merge matches per-shard BMFs
        run: |
          jq -s 'add' perf-results-*/bencher-bmf.json > bencher-bmf-jq.json
          diff <(jq -S . bencher-bmf-merged.json) <(jq -S . bencher-bmf-jq.json)

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-merged
          path: |
            perf-results-merged.json
            bencher-bmf-merged.json
